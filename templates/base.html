<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Job Matching System — Aggregates, scores, and ranks jobs for AI/ML engineers.">
    <title>{% block title %}AI Job Matching System{% endblock %}</title>

    <!-- TailwindCSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        surface: {
                            50:  '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        accent: {
                            50:  '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        },
                    },
                },
            },
        }
    </script>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* Base resets and custom scrollbar */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #f8fafc; /* surface-50 */
        }
        
        .dark body {
            background-color: #020617; /* surface-950 */
            color: #f1f5f9; /* surface-100 */
        }

        /* Subtle scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Custom UI Components */
        .glass-panel {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(51, 65, 85, 0.8);
        }

        .card-shadow {
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03);
        }
        .dark .card-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
        }

        .card-hover {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            border-color: #cbd5e1;
        }
        .dark .card-hover:hover {
            border-color: #475569;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Applied job styling - More subtle but distinct */
        .applied-muted {
            opacity: 0.55;
            filter: grayscale(0.4);
            background-color: #f1f5f9;
        }
        .dark .applied-muted {
            background-color: #0f172a;
            opacity: 0.45;
        }
        .applied-muted:hover {
            opacity: 0.85;
            filter: grayscale(0.1);
        }

        /* Source badge colors - Refined for professional look */
        .source-remoteok { background: #ecfdf5; color: #065f46; border: 1px solid #d1fae5; }
        .source-naukri   { background: #eff6ff; color: #1e40af; border: 1px solid #dbeafe; }
        .source-internshala { background: #fff7ed; color: #9a3412; border: 1px solid #ffedd5; }
        .source-wellfound { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .source-default  { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

        .dark .source-remoteok { background: #064e3b; color: #d1fae5; border: 1px solid #065f46; }
        .dark .source-naukri   { background: #1e3a8a; color: #dbeafe; border: 1px solid #1e40af; }
        .dark .source-internshala { background: #7c2d12; color: #ffedd5; border: 1px solid #9a3412; }
        .dark .source-wellfound { background: #78350f; color: #fde68a; border: 1px solid #92400e; }
        .dark .source-default  { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }

        /* Animation for score fill */
        .score-fill {
            transition: width 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }
    </style>
    <script>
        // Init theme early to avoid flash
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-surface-50 dark:bg-surface-950 text-surface-800 dark:text-surface-100 min-h-screen flex flex-col selection:bg-accent-100 dark:selection:bg-accent-900 selection:text-accent-900 dark:selection:text-accent-100">

    <!-- Navigation -->
    <nav class="bg-white/80 dark:bg-surface-900/80 backdrop-blur-md border-b border-surface-200 dark:border-surface-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-14">
                <!-- Logo / Brand -->
                <a href="/" class="flex items-center gap-2.5 group">
                    <div class="w-7 h-7 bg-surface-900 dark:bg-surface-100 rounded-md flex items-center justify-center transition-transform group-hover:scale-105">
                        <svg class="w-4 h-4 text-white dark:text-surface-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <span class="text-base font-bold text-surface-900 dark:text-surface-50 tracking-tight">JobMatch <span class="text-accent-600 dark:text-accent-400 font-medium">Pro</span></span>
                </a>

                <!-- Nav Links -->
                <div class="hidden sm:flex items-center gap-1">
                    <a href="/"
                       class="px-3 py-1.5 rounded-md text-sm font-medium transition-all
                              {% if active_page == 'dashboard' %}text-surface-900 dark:text-surface-50 bg-surface-100 dark:bg-surface-800{% else %}text-surface-500 hover:text-surface-900 dark:hover:text-surface-300 hover:bg-surface-50 dark:hover:bg-surface-800/50{% endif %}">
                        Dashboard
                    </a>
                    <a href="/top"
                       class="px-3 py-1.5 rounded-md text-sm font-medium transition-all
                              {% if active_page == 'top' %}text-surface-900 dark:text-surface-50 bg-surface-100 dark:bg-surface-800{% else %}text-surface-500 hover:text-surface-900 dark:hover:text-surface-300 hover:bg-surface-50 dark:hover:bg-surface-800/50{% endif %}">
                        Priority
                    </a>
                    <a href="/settings"
                       class="px-3 py-1.5 rounded-md text-sm font-medium transition-all
                              {% if active_page == 'settings' %}text-surface-900 dark:text-surface-50 bg-surface-100 dark:bg-surface-800{% else %}text-surface-500 hover:text-surface-900 dark:hover:text-surface-300 hover:bg-surface-50 dark:hover:bg-surface-800/50{% endif %}">
                        Admin
                    </a>
                </div>

                <!-- Right Side Actions -->
                <div class="flex items-center gap-2 sm:gap-4">
                    <!-- Theme Toggle -->
                    <button onclick="toggleTheme()" id="theme-toggle" class="p-2 rounded-lg text-surface-500 dark:text-surface-400 hover:bg-surface-100 dark:hover:bg-surface-800 transition-colors">
                        <svg id="theme-toggle-dark-icon" class="hidden w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                        <svg id="theme-toggle-light-icon" class="hidden w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                    </button>

                    <button onclick="runPipeline()"
                            id="btn-run-pipeline"
                            class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-surface-900 dark:bg-surface-50 text-white dark:text-surface-900 text-xs font-semibold rounded-md
                                   hover:bg-surface-800 dark:hover:bg-surface-200 active:scale-95 transition-all shadow-sm">
                        <svg id="run-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        <svg id="run-spinner" class="w-3.5 h-3.5 animate-spin hidden" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                        </svg>
                        <span id="run-text">Sync</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-20 right-4 z-50 hidden">
        <div class="bg-white dark:bg-surface-900 border border-surface-200 dark:border-surface-800 rounded-xl shadow-lg px-5 py-4 flex items-center gap-3 max-w-sm">
            <div id="toast-icon" class="flex-shrink-0"></div>
            <p id="toast-message" class="text-sm text-surface-700 dark:text-surface-300"></p>
        </div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-surface-200 dark:border-surface-800 bg-white dark:bg-surface-950 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5">
            <p class="text-center text-[10px] font-bold text-surface-400 dark:text-surface-600 uppercase tracking-[0.2em]">
                AI Job Matching System &middot; Built with FastAPI + TailwindCSS
            </p>
        </div>
    </footer>

    <!-- Global Scripts -->
    <script>
        // Theme Management
        function updateThemeIcons() {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('theme-toggle-dark-icon').classList.toggle('hidden', isDark);
            document.getElementById('theme-toggle-light-icon').classList.toggle('hidden', !isDark);
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcons();
        }
        
        // Initial icon state
        updateThemeIcons();

        // Run pipeline with visual feedback
        async function runPipeline() {
            const btn = document.getElementById('btn-run-pipeline');
            const icon = document.getElementById('run-icon');
            const spinner = document.getElementById('run-spinner');
            const text = document.getElementById('run-text');

            btn.disabled = true;
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            icon.classList.add('hidden');
            spinner.classList.remove('hidden');
            text.textContent = 'Scraping…';

            try {
                const res = await fetch('/run', { method: 'POST' });
                const data = await res.json();
                showToast(
                    'success',
                    `Done! ${data.new_saved} new jobs saved, ${data.duplicates} duplicates skipped.`
                );
                // Reload the page after a short delay to show new jobs
                setTimeout(() => window.location.reload(), 1500);
            } catch (err) {
                showToast('error', 'Pipeline failed. Check the server logs.');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
                icon.classList.remove('hidden');
                spinner.classList.add('hidden');
                text.textContent = 'Scrape Jobs';
            }
        }

        // Toggle job applied status
        async function toggleApplied(jobId, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            
            try {
                const res = await fetch(`/api/jobs/${jobId}/toggle_applied`, { method: 'POST' });
                const data = await res.json();
                
                // Find all elements for this job and update them
                const cards = document.querySelectorAll(`[data-job-id="${jobId}"]`);
                cards.forEach(card => {
                    const btnText = data.applied ? 'Mark Unapplied' : 'Mark Applied';
                    
                    if (data.applied) {
                        card.classList.add('applied-muted');
                        card.querySelectorAll('.applied-badge').forEach(b => b.classList.remove('hidden'));
                    } else {
                        card.classList.remove('applied-muted');
                        card.querySelectorAll('.applied-badge').forEach(b => b.classList.add('hidden'));
                    }

                    // Update button text (handles both dashboard and detail page layouts)
                    card.querySelectorAll('.btn-mark-applied').forEach(btn => {
                        const label = btn.querySelector('.btn-text');
                        if (label) {
                            label.textContent = btnText;
                        } else {
                            btn.textContent = btnText;
                        }
                    });
                    
                    // Detail page specific
                    const statusText = card.querySelector('#applied-status-text');
                    if (statusText) statusText.textContent = data.applied ? 'Yes' : 'No';
                });
                
                showToast('success', data.applied ? 'Job marked as applied.' : 'Job marked as not applied.');
            } catch (err) {
                showToast('error', 'Failed to update applied status.');
            }
        }

        // Toast notification
        function showToast(type, message) {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toast-icon');
            const toastMsg = document.getElementById('toast-message');

            const icons = {
                success: `<svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                          </svg>`,
                error:   `<svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                          </svg>`,
            };

            toastIcon.innerHTML = icons[type] || icons.success;
            toastMsg.textContent = message;
            toast.classList.remove('hidden');

            setTimeout(() => toast.classList.add('hidden'), 5000);
        }

        // Score color helper
        function getScoreColor(score) {
            if (score >= 0.7) return 'text-emerald-600';
            if (score >= 0.4) return 'text-amber-600';
            return 'text-surface-400';
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
